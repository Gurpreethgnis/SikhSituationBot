[build]
builder = "NIXPACKS"

[build.variables]
PYTHONPATH = "."

[deploy]
startCommand = "sh -c \"export PYTHONPATH=$PYTHONPATH:. && gunicorn main:app --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --timeout 120\""
restartPolicyType = "ON_FAILURE"

[deploy.variables]
PYTHONPATH = "."
